# Sample Secret holding the agent token. Do NOT commit a real token.
#
# Prefer creating it imperatively so the value never lands in a file:
#
#   kubectl create secret generic skyportalai-agent-token \
#     --from-literal=SKYPORTALAI_AGENT_TOKEN=agt_xxxxxxxxxxxxxxxxxxxxxxxx
#
# If you must use a manifest, fill in stringData below and keep it out of git.
apiVersion: v1
kind: Secret
metadata:
  name: skyportalai-agent-token
  labels:
    app.kubernetes.io/name: skyportalai-agent
    app.kubernetes.io/instance: skyportalai-agent
type: Opaque
stringData:
  # EDIT: paste the token minted for this agent (see deploy/agent/README.md).
  SKYPORTALAI_AGENT_TOKEN: "agt_REPLACE_ME"
