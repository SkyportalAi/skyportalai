{{- if include "skyportalai-agent.createsTokenSecret" . }}
# Created only for token.value. With token.existingSecret the chart renders no
# Secret and never sees the token.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "skyportalai-agent.tokenSecretName" . }}
  labels:
    {{- include "skyportalai-agent.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.token.secretKey }}: {{ .Values.token.value | b64enc | quote }}
{{- end }}
