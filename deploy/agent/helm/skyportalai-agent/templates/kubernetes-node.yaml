{{- /*
One pod per node, always on: CPU, memory, disk, load and GPUs every cycle.

Host access, all read only or confined to the agent's own directory:
  - the host's /proc, read only, for psutil;
  - a hostPath spool under /var/lib (a ReadWriteOnce claim can't be shared by N
    nodes); its filesystem is also the disk the node reports;
  - GPU visibility for NVML via kubernetes.node.gpu.runtimeClassName, on GPU
    nodes only. No nvidia.com/gpu request, which would take a GPU from workloads.
hostPath volumes are refused by the "baseline" and "restricted" Pod Security
Standards, so this namespace must allow them (see deploy/agent/README.md).

With a RuntimeClass set, this one pod template renders two DaemonSets (#3625):
"node-gpu" on the nodes carrying kubernetes.node.gpu.nodeLabel, with the
RuntimeClass, and "node" on every other node, without it. A node whose runtime
lacks the class's handler can't start a pod that names it, so a single DaemonSet
would lose either the GPU metrics or the CPU-only nodes.
*/}}
{{- if .Values.kubernetes.enabled }}
{{- $node := .Values.kubernetes.node }}
{{- range $component := include "skyportalai-agent.nodeComponents" . | fromYamlArray }}
{{- $labels := dict "root" $ "component" $component }}
{{- $onGpu := eq $component "node-gpu" }}
{{- /* Node affinity is only checked at scheduling, so a node relabelled while its
pods run can briefly host both variants: they must not share a spool. */}}
{{- $spool := $node.spoolHostPath }}
{{- if $onGpu }}
{{- $spool = printf "%s-gpu" (trimSuffix "/" $node.spoolHostPath) }}
{{- end }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "skyportalai-agent.fullname" $ }}-{{ $component }}
  labels:
    {{- include "skyportalai-agent.componentLabels" $labels | nindent 4 }}
spec:
  # Immutable after install. "node" keeps the selector it had before node-gpu
  # existed, so `helm upgrade` updates an existing install in place.
  selector:
    matchLabels:
      {{- include "skyportalai-agent.componentSelectorLabels" $labels | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{- include "skyportalai-agent.componentSelectorLabels" $labels | nindent 8 }}
      {{- with include "skyportalai-agent.tokenChecksumAnnotations" $ }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "skyportalai-agent.serviceAccountName" $ }}
      # The node role never calls the Kubernetes API, so it gets no token at all.
      automountServiceAccountToken: false
      {{- if $onGpu }}
      runtimeClassName: {{ $node.gpu.runtimeClassName | quote }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      initContainers:
        # A hostPath directory is created root-owned; hand it to the agent's uid
        # so the main container can run as non-root. Runs once per pod start.
        - name: spool-owner
          image: {{ include "skyportalai-agent.image" $ | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["sh", "-c", "chown 1000:1000 /spool"]
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [CHOWN]
          volumeMounts:
            - name: spool
              mountPath: /spool
      containers:
        - name: agent
          image: {{ include "skyportalai-agent.image" $ | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          {{- with $.Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: SKYPORTALAI_AGENT_ROLE
              value: node
            - name: SKYPORTALAI_AGENT_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: SKYPORTALAI_AGENT_HOST_PROC
              value: /host/proc
            - name: SKYPORTALAI_AGENT_STATE_DIR
              value: /var/lib/skyportalai-agent
            {{- if $onGpu }}
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: utility
            {{- end }}
            {{- include "skyportalai-agent.kubernetesEnv" $ | nindent 12 }}
          ports:
            - name: healthz
              containerPort: {{ $.Values.config.healthzPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml $node.resources | nindent 12 }}
          volumeMounts:
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
            - name: spool
              mountPath: /var/lib/skyportalai-agent
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: host-proc
          hostPath:
            path: /proc
            type: Directory
        - name: spool
          hostPath:
            path: {{ $spool | quote }}
            type: DirectoryOrCreate
        - name: tmp
          emptyDir:
            sizeLimit: {{ $.Values.tmpDir.sizeLimit | quote }}
      {{- $nodeSelector := $node.nodeSelector }}
      {{- if $onGpu }}
      {{- $nodeSelector = merge (dict $node.gpu.nodeLabel.key $node.gpu.nodeLabel.value) $node.nodeSelector }}
      {{- end }}
      {{- with $nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and (not $onGpu) $node.gpu.runtimeClassName }}
      # Every node the node-gpu DaemonSet doesn't take. NotIn also matches a node
      # without the label, so an unlabelled GPU node is monitored as CPU only.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: {{ $node.gpu.nodeLabel.key | quote }}
                    operator: NotIn
                    values:
                      - {{ $node.gpu.nodeLabel.value | quote }}
      {{- end }}
      {{- with $node.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
