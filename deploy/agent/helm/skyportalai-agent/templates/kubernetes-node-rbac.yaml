{{- /*
The node pods' own identity, only with kubernetes.node.kubelet.enabled (#3588). Each
node pod reads its own node's kubelet /stats/summary for per-pod CPU and memory, the
source metrics-server itself reads. `get` on nodes/stats and nothing else: not
nodes/proxy, which reaches the kubelet's exec, attach and log endpoints.
*/}}
{{- if and .Values.kubernetes.enabled .Values.kubernetes.node.kubelet.enabled }}
{{- include "skyportalai-agent.requireKubeletImage" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "skyportalai-agent.fullname" . }}-node
  labels:
    {{- include "skyportalai-agent.componentLabels" (dict "root" . "component" "node") | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "skyportalai-agent.fullname" . }}-node-stats
  labels:
    {{- include "skyportalai-agent.componentLabels" (dict "root" . "component" "node") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes/stats]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "skyportalai-agent.fullname" . }}-node-stats
  labels:
    {{- include "skyportalai-agent.componentLabels" (dict "root" . "component" "node") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "skyportalai-agent.fullname" . }}-node-stats
subjects:
  - kind: ServiceAccount
    name: {{ include "skyportalai-agent.fullname" . }}-node
    namespace: {{ .Release.Namespace }}
{{- end }}
