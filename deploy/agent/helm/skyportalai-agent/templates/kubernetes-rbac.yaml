{{- if .Values.kubernetes.enabled }}
{{- include "skyportalai-agent.requireKubernetesImage" . }}
# The cluster role's identity. Read-only, cluster wide, bound below. The node
# DaemonSet does not use it: it reads the host, never the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "skyportalai-agent.fullname" . }}-cluster
  labels:
    {{- include "skyportalai-agent.componentLabels" (dict "root" . "component" "cluster") | nindent 4 }}
---
{{- if .Values.kubernetes.namespaces }}
{{- include "skyportalai-agent.requireNamespacesImage" . }}
{{- $fullname := include "skyportalai-agent.fullname" . }}
{{- $labels := include "skyportalai-agent.componentLabels" (dict "root" . "component" "cluster") }}
{{- $releaseNamespace := .Release.Namespace }}
# Namespaced mode (kubernetes.namespaces): the baseline reads below, but in the listed
# namespaces only, so a leaked token can't read a pod log anywhere else. Keep the
# rules in step with the ClusterRole in the default branch and with the Role in
# skyportal-website deploy/cluster-access/role-readonly.example.yaml. A namespace that
# doesn't exist fails the install. services and the proxy are not granted, as below.
{{- range .Values.kubernetes.namespaces }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-readonly
  namespace: {{ . }}
  labels:
    {{- $labels | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, events]
    verbs: [get, list, watch]
  # kubectl logs --previous, fetched for failing pods only.
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list]
  # kubectl top pods; without metrics-server these reads find nothing, which is fine.
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-readonly
  namespace: {{ . }}
  labels:
    {{- $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}-readonly
subjects:
  - kind: ServiceAccount
    name: {{ $fullname }}-cluster
    namespace: {{ $releaseNamespace }}
---
{{- end }}
# The one cluster scoped read left. No Role can grant nodes, and skyportalai's nodes read
# is also how it tells a reachable cluster from an unreachable one, so dropping it
# would report every scoped cluster as down. Node names, capacity and metrics only:
# no pods, logs, events or namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-nodes
  labels:
    {{- $labels | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}-nodes
  labels:
    {{- $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullname }}-nodes
subjects:
  - kind: ServiceAccount
    name: {{ $fullname }}-cluster
    namespace: {{ $releaseNamespace }}
{{- else }}
# Copied from the baseline role in skyportal-website deploy/cluster-access/
# clusterrole-readonly.yaml (#3527). Keep the two in step. No write verb anywhere: no
# create, update, patch, delete, exec.
# Covers the snapshot reads (pods, events, workloads, crash logs, kubectl top). Not
# granted: services and the pod/service proxy, which the server's DCGM and vLLM
# scrapes use; #3527 makes those opt-in because services/proxy reaches any Service.
# GPU numbers come from the node agent's NVML instead; vLLM serving metrics are not
# collected on the agent route yet.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "skyportalai-agent.fullname" . }}-readonly
  labels:
    {{- include "skyportalai-agent.componentLabels" (dict "root" . "component" "cluster") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes, namespaces, pods, events]
    verbs: [get, list, watch]
  # kubectl logs --previous, fetched for failing pods only.
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list]
  # kubectl top; without metrics-server these reads find nothing, which is fine.
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "skyportalai-agent.fullname" . }}-readonly
  labels:
    {{- include "skyportalai-agent.componentLabels" (dict "root" . "component" "cluster") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "skyportalai-agent.fullname" . }}-readonly
subjects:
  - kind: ServiceAccount
    name: {{ include "skyportalai-agent.fullname" . }}-cluster
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
